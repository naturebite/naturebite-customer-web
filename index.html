<!DOCTYPE html>
<html lang="en">
<head>

      content="width=device-width, initial-scale=1.0">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;

}

button,
input,
select,

button{

.header{

.nav{

.logo{

.nav-actions{

.nav-btn{

.product-card button{

.form-group input,

}

.alert.show{

}

.alert.error{

}

.login-actions{

.cart-item{

.cart-info{

.cart-name{

}

.cart-variant{

.qty-controls{

.qty-controls button{

}

.summary-row{

}

.summary-row.total{

.variant-list{

}

.variant-btn{

.variant-btn.active{

.order-card{

.order-header{

@media(max-width:600px){

  }

</style>

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber,
  signInWithEmailAndPassword,
  linkWithCredential,
  EmailAuthProvider,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  addDoc,
  query,
  where,
  orderBy,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",

  authDomain:
    "naturebite-c5d88.firebaseapp.com",

  projectId:
    "naturebite-c5d88",

  storageBucket:
    "naturebite-c5d88.firebasestorage.app",

  messagingSenderId:
    "467003957826",

  appId:
    "1:467003957826:web:483a261d12ac396dca43db"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let products = [];

let variants = [];

let categories = [];

let cart = [];

let selectedCategory = "All";

let selectedProduct = null;

let selectedVariant = null;

let recaptchaVerifier = null;

let confirmationResult = null;

let pendingCheckout = false;

let settings = {

  platformCharge: 5,

  platformChargeType: "fixed",

  standardDelivery: 60,

  expressDelivery: 80,

  freeDelivery: 0,

  deliveryPrepaidRequired: true

};


/* =========================================================
   HELPERS
========================================================= */

function money(value){

  return "৳" +
    Number(value || 0)
      .toLocaleString("en-BD", {
        maximumFractionDigits: 2
      });

}


function normalizePhone(phone){

  let value =
    String(phone || "")
      .trim()
      .replace(/\s+/g,"");

  if(value.startsWith("01")){

    return "+880" + value.substring(1);

  }

  if(value.startsWith("8801")){

    return "+" + value;

  }

  if(value.startsWith("+880")){

    return value;

  }

  return value;

}


function phoneToEmail(phone){

  const digits =
    normalizePhone(phone)
      .replace(/\D/g,"");

  return "user_" +
    digits +
    "@naturebite.customer";

}


function showLoginAlert(message,type="error"){

  const alert =
    document.getElementById("loginAlert");

  alert.textContent = message;

  alert.className =
    "alert show " + type;

}


function showCheckoutAlert(message,type="error"){

  const alert =
    document.getElementById("checkoutAlert");

  alert.textContent = message;

  alert.className =
    "alert show " + type;

}


function getFirebaseError(error){

  const code = error?.code || "";

  const messages = {

    "auth/invalid-phone-number":
      "সঠিক mobile number দিন।",

    "auth/invalid-verification-code":
      "OTP সঠিক নয়।",

    "auth/code-expired":
      "OTP-এর সময় শেষ হয়েছে। আবার OTP নিন।",

    "auth/too-many-requests":
      "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",

    "auth/invalid-credential":
      "Mobile number বা password সঠিক নয়।",

    "auth/wrong-password":
      "Password সঠিক নয়।",

    "auth/user-not-found":
      "এই account পাওয়া যায়নি।",

    "auth/email-already-in-use":
      "এই account-এর password আগে থেকেই আছে।",

    "auth/provider-already-linked":
      "এই account-এ password আগে থেকেই যুক্ত আছে।",

    "auth/weak-password":
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",

    "auth/network-request-failed":
      "Internet connection সমস্যা হয়েছে।",

    "auth/quota-exceeded":
      "OTP service limit অতিক্রম করেছে। পরে আবার চেষ্টা করুন।"

  };

  return messages[code] ||
    error?.message ||
    "কিছু সমস্যা হয়েছে। আবার চেষ্টা করুন।";

}


/* =========================================================
   MODAL
========================================================= */

window.closeModal = function(id){

  document
    .getElementById(id)
    .classList.remove("show");

};


function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

}


/* =========================================================
   SETTINGS
========================================================= */

async function loadSettings(){

  try{

    const snap =
      await getDoc(
        doc(db,"settings","platform")
      );

    if(snap.exists()){

      settings = {
        ...settings,
        ...snap.data()
      };

    }

  }catch(error){

    console.error(
      "Settings error:",
      error
    );

  }

}


/* =========================================================
   PRODUCTS
========================================================= */

async function loadProducts(){

  try{

    const snap =
      await getDocs(
        collection(db,"products")
      );

    products = [];

    snap.forEach(item => {

      const data = item.data();

      if(data.status !== "inactive"){

        products.push({

          id:item.id,
          ...data

        });

      }

    });

  }catch(error){

    console.error(error);

  }

}


async function loadVariants(){

  try{

    const snap =
      await getDocs(
        collection(db,"product_variants")
      );

    variants = [];

    snap.forEach(item => {

      variants.push({

        id:item.id,
        ...item.data()

      });

    });

  }catch(error){

    console.error(error);

  }

}


async function loadCategories(){

  try{

    const snap =
      await getDocs(
        collection(db,"categories")
      );

    categories = [];

    snap.forEach(item => {

      const data = item.data();

      if(data.status !== "inactive"){

        categories.push({

          id:item.id,
          ...data

        });

      }

    });

    categories.sort(
      (a,b) =>
        Number(a.sortOrder || 0) -
        Number(b.sortOrder || 0)
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   CATEGORY UI
========================================================= */

function renderCategories(){

  const box =
    document.getElementById(
      "categoryList"
    );

  box.innerHTML = "";

  const all =
    document.createElement("button");

  all.className =
    "category-btn " +
    (
      selectedCategory === "All"
        ? "active"
        : ""
    );

  all.textContent = "All";

  all.onclick = () => {

    selectedCategory = "All";

    renderCategories();

    filterProducts();

  };

  box.appendChild(all);


  categories.forEach(category => {

    const btn =
      document.createElement("button");

    btn.className =
      "category-btn " +
      (
        selectedCategory === category.name
          ? "active"
          : ""
      );

    btn.textContent =
      category.name;

    btn.onclick = () => {

      selectedCategory =
        category.name;

      renderCategories();

      filterProducts();

    };

    box.appendChild(btn);

  });

}


/* =========================================================
   PRODUCT UI
========================================================= */

window.filterProducts = function(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    products.filter(product => {

      const matchCategory =
        selectedCategory === "All" ||
        product.category === selectedCategory;


      const matchSearch =
        !search ||
        String(product.name || "")
          .toLowerCase()
          .includes(search) ||
        String(product.description || "")
          .toLowerCase()
          .includes(search);


      return matchCategory &&
             matchSearch;

    });


  renderProducts(filtered);

};


function getProductVariants(productId){

  return variants.filter(
    variant =>
      variant.productId === productId &&
      variant.status !== "inactive"
  );

}


function renderProducts(list){

  const grid =
    document.getElementById(
      "productGrid"
    );

  grid.innerHTML = "";


  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;

  }


  list.forEach(product => {

    const productVariants =
      getProductVariants(product.id);

    const first =
      productVariants[0];


    const card =
      document.createElement("div");

    card.className =
      "product-card";


    card.innerHTML = `

      <div class="product-image">
        ${product.emoji || "🌿"}
      </div>

      <div class="product-body">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-category">
          ${escapeHtml(product.category || "")}
        </div>

        <div class="product-price">
          ${
            first
              ? money(first.price)
              : "Price unavailable"
          }
        </div>

        <button
          class="primary-btn"
          onclick="openProduct('${escapeAttr(product.id)}')">

          View Product

        </button>

      </div>

    `;


    grid.appendChild(card);

  });

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =========================================================
   PRODUCT DETAILS
========================================================= */

window.openProduct = function(productId){

  selectedProduct =
    products.find(
      p => p.id === productId
    );

  if(!selectedProduct){
    return;
  }


  const productVariants =
    getProductVariants(productId);


  selectedVariant =

window.addSelectedToCart = function(){

  if(!selectedProduct ||
     !selectedVariant){

    return;

  }


  if(
    Number(selectedVariant.stock || 0) <= 0
  ){

    alert("এই variant বর্তমানে stock out.");

    return;

  }


  addToCart(
    selectedProduct,
    selectedVariant
  );

  closeModal("productModal");

};


function addToCart(product,variant){

  const existing =
    cart.find(
      item =>
        item.variantId === variant.id
    );


  if(existing){

    existing.qty += 1;

  }else{

    cart.push({

      productId:product.id,

      productName:product.name,

      variantId:variant.id,

      weight:variant.weight || "",

      price:Number(variant.price || 0),

      qty:1

    });

  }


  saveCart();

  updateCartCount();

}


/* =========================================================
   CART
========================================================= */

function saveCart(){

  localStorage.setItem(
    "naturebite_cart",
    JSON.stringify(cart)
  );

}


function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "naturebite_cart"
        ) || "[]"
      );

    if(!Array.isArray(cart)){

      cart = [];

    }

  }catch{

    cart = [];

  }

}


function updateCartCount(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.qty || 0),
      0
    );


  document
    .getElementById("cartCount")
    .textContent = count;

}


window.openCart = function(){

  renderCart();

  openModal("cartModal");

};


function renderCart(){

  const box =
    document.getElementById(
      "cartContent"
    );


  if(!cart.length){

    box.innerHTML = `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

    return;

  }


  let subtotal = 0;


  const items =
    cart.map((item,index) => {

      const total =
        Number(item.price || 0) *
        Number(item.qty || 0);

      subtotal += total;


      return `

        <div class="cart-item">

          <div class="cart-info">

            <div class="cart-name">
              ${escapeHtml(item.productName)}
            </div>

            <div class="cart-variant">
              ${escapeHtml(item.weight)}
              · ${money(item.price)}
            </div>

            <div class="qty-controls">

              <button
                onclick="changeQty(${index},-1)">
                −
              </button>

              <strong>
                ${item.qty}
              </strong>

              <button
                onclick="changeQty(${index},1)">
                +
              </button>

              <button
                class="danger-btn"
                onclick="removeCartItem(${index})">
                Remove
              </button>

            </div>

          </div>

          <strong>
            ${money(total)}
          </strong>

        </div>

      `;

    }).join("");


  box.innerHTML = `

    ${items}

    <div class="summary">

      <div class="summary-row">

        <span>Subtotal</span>

        <strong>
          ${money(subtotal)}
        </strong>

      </div>

      <button
        class="primary-btn"
        style="width:100%;margin-top:10px;"
        onclick="startCheckout()">

        Proceed to Checkout

      </button>

    </div>

  `;

}


window.changeQty = function(index,change){

  if(!cart[index]){
    return;
  }


  cart[index].qty += change;


  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }


  saveCart();

  updateCartCount();

  renderCart();

};


window.removeCartItem = function(index){

  cart.splice(index,1);

  saveCart();

  updateCartCount();

  renderCart();

};

window.updateCheckoutSummary = function(){

  const delivery =
    document.getElementById(
      "deliveryType"
    )?.value || "standard";


  const subtotal =
    cartSubtotal();


  let deliveryCharge =
    Number(settings.standardDelivery || 60);


  if(delivery === "express"){

    deliveryCharge =
      Number(settings.expressDelivery || 80);

  }


  if(delivery === "free"){

    deliveryCharge =
      Number(settings.freeDelivery || 0);

  }


  let platformCharge = 0;


  if(
    settings.platformChargeType === "percent"
  ){

    platformCharge =
      subtotal *
      Number(settings.platformCharge || 0) /
      100;

  }else{

    platformCharge =
      Number(settings.platformCharge || 0);

  }


  const total =
    subtotal +
    deliveryCharge +
    platformCharge;


  const box =
    document.getElementById(
      "checkoutSummary"
    );


  if(box){

    box.innerHTML = `

      <div class="summary-row">

        <span>Subtotal</span>

        <strong>
          ${money(subtotal)}
        </strong>

      </div>

      <div class="summary-row">

          ${money(platformCharge)}
        </strong>

      </div>

      <div class="summary-row total">

        <span>Total</span>

        <strong>
          ${money(total)}
        </strong>

      </div>

    `;

  }


  return {

    subtotal,

    deliveryCharge,

    platformCharge,

    total

  };

};


window.placeOrder = async function(){

  if(!currentUser){

    pendingCheckout = true;

    openLogin();

    return;

  }


  if(!cart.length){

    return;

  }


  const name =
    document
      .getElementById("checkoutName")
      .value.trim();


  const address =
    document
      .getElementById("checkoutAddress")
      .value.trim();


  const deliveryType =
    document
      .getElementById("deliveryType")
      .value;


  const paymentMethod =
    document
      .getElementById("paymentMethod")
      .value;


  const transactionId =
    document
      .getElementById("transactionId")
      ?.value
      .trim() || "";


  if(!name){

    showCheckoutAlert(
      "নাম দিন।",
      "error"
    );

    return;

  }


  if(!address){

    showCheckoutAlert(
      "Delivery address দিন।",
      "error"
    );

    return;

  }


  if(
    (
      paymentMethod === "bkash" ||
      paymentMethod === "nagad"
    ) &&
    settings.deliveryPrepaidRequired &&
    deliveryType !== "free" &&
    !transactionId
  ){

    showCheckoutAlert(
      "Online payment-এর Transaction ID দিন।",
      "error"
    );

    return;

  }


  const summary =
    updateCheckoutSummary();


  try{

    const orderData = {

      customerUid:
        currentUser.uid,

      customerMobile:
        currentUser.phoneNumber || "",

      customerName:
        name,

      deliveryAddress:
        address,

      deliveryType:
        deliveryType,

      deliveryCharge:
        summary.deliveryCharge,

      platformCharge:
        summary.platformCharge,

      subtotal:
        summary.subtotal,

      total:
        summary.total,

      paymentMethod:
        paymentMethod,

      transactionId:
        transactionId,

      paymentStatus:
        paymentMethod === "cod"
          ? "pending"
          : (
              transactionId
                ? "submitted"
                : "pending"
            ),

      status:
        "pending",

      items:
        cart.map(item => ({
          productId:item.productId,
          productName:item.productName,
          variantId:item.variantId,
          weight:item.weight,
          price:item.price,
          qty:item.qty
        })),

      createdAt:
        serverTimestamp()

    };


    const orderRef =
      await addDoc(
        collection(db,"orders"),
        orderData
      );


    cart = [];

    saveCart();

    updateCartCount();


    closeModal("checkoutModal");


    alert(
      "Order successfully placed!\nOrder ID: " +
      orderRef.id
    );


    openOrders();

  }catch(error){

    console.error(error);

    showCheckoutAlert(
      "Order place করা যায়নি: " +
      error.message,
      "error"
    );

  }

};

window.sendOTP = async function(){

  const input =
    document.getElementById(
      "loginPhone"
    );


  const phone =
    normalizePhone(
      input?.value
    );


  if(!phone){

    showLoginAlert(
      "Mobile number দিন।",
      "error"
    );

    return;

  }


  if(!/^\+8801[3-9]\d{8}$/.test(phone)){

    showLoginAlert(
      "সঠিক Bangladesh mobile number দিন।",
      "error"
    );

    return;

  }


  try{

    await setupRecaptcha();


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );


    renderOTPInput(phone);


  }catch(error){

    console.error(error);

    resetRecaptcha();

    showLoginAlert(
      getFirebaseError(error),
      "error"
    );

  }

};


async function setupRecaptcha(){

  if(recaptchaVerifier){

    return;

  }


  recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {

        size:"invisible",

        callback: () => {

          console.log(
            "reCAPTCHA solved."
          );

        },

        "expired-callback": () => {

          resetRecaptcha();

        }

      }
    );

}


function resetRecaptcha(){

  try{

    if(recaptchaVerifier){

      recaptchaVerifier.clear();

    }

  }catch(error){

    console.error(error);

  }

  recaptchaVerifier = null;

}

window.verifyOTP = async function(){

  const otpInput =
    document.getElementById(
      "otpInput"
    );


  if(!otpInput){

    return;

  }


  const otp =
    otpInput.value.trim();


  if(!/^\d{6}$/.test(otp)){

    showLoginAlert(
      "৬ সংখ্যার OTP দিন।",
      "error"
    );

    return;

  }


  if(!confirmationResult){

    showLoginAlert(
      "OTP session পাওয়া যায়নি। আবার OTP নিন।",
      "error"
    );

    return;

  }


  try{

    const result =
      await confirmationResult.confirm(
        otp
      );


    currentUser =
      result.user;


    resetRecaptcha();


    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const userSnap =
      await getDoc(userRef);


    if(
      userSnap.exists() &&
      userSnap.data().hasPassword === true
    ){

      closeLogin();


      if(pendingCheckout){

        pendingCheckout = false;

        openCheckout();

      }

      return;

    }


    renderSetPassword();


  }catch(error){

    console.error(error);

    showLoginAlert(
      getFirebaseError(error),
      "error"
    );

  }

};

window.saveNewPassword = async function(){

  const password =
    document
      .getElementById("newPassword")
      ?.value
      .trim();


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      ?.value
      .trim();


  if(!password || !confirmPassword){

    showLoginAlert(
      "দুইটি password field পূরণ করুন।",
      "error"
    );

    return;

  }


  if(password.length < 6){

    showLoginAlert(
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
      "error"
    );

    return;

  }


  if(password !== confirmPassword){

    showLoginAlert(
      "দুইটি password একই নয়।",
      "error"
    );

    return;

  }


  if(!currentUser){

    showLoginAlert(
      "Session পাওয়া যায়নি। আবার OTP দিয়ে চেষ্টা করুন।",
      "error"
    );

    return;

  }


  try{

    const email =
      phoneToEmail(
        currentUser.phoneNumber
      );


    const credential =
      EmailAuthProvider.credential(
        email,
        password
      );


    await linkWithCredential(
      currentUser,
      credential
    );


    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid
      ),
      {

        uid:
          currentUser.uid,

        mobile:
          currentUser.phoneNumber || "",

        email:
          email,

        hasPassword:
          true,

        createdAt:
          serverTimestamp(),

        updatedAt:
          serverTimestamp()

      },
      {
        merge:true
      }
    );


    showLoginAlert(
      "Account successfully created!",
      "success"
    );


    setTimeout(() => {

      closeLogin();


      if(pendingCheckout){

        pendingCheckout = false;

        openCheckout();

      }

    },800);


  }catch(error){

    console.error(error);

    showLoginAlert(
      getFirebaseError(error),
      "error"
    );

  }

};

        ">

          নিরাপদ production password reset-এর
          জন্য পরে backend verification যুক্ত
          করতে হবে।

        </p>

      </div>

    `;

}


window.sendForgotOTP = async function(){

  const phone =
    normalizePhone(
      document
        .getElementById("forgotPhone")
        ?.value
    );


  if(!/^\+8801[3-9]\d{8}$/.test(phone)){

    showLoginAlert(
      "সঠিক Bangladesh mobile number দিন।",
      "error"
    );

    return;

  }


  try{

    await setupRecaptcha();


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        phone,
        recaptchaVerifier
      );


    document
      .getElementById("loginContent")
      .innerHTML = `

        <div class="login-step">

          <h3>
            Verify OTP
          </h3>

          <p>
            OTP পাঠানো হয়েছে:
            ${escapeHtml(phone)}
          </p>

          <input
            id="forgotOtp"
            inputmode="numeric"
            maxlength="6"
            placeholder="6 digit OTP">

          <button
            class="primary-btn"
            style="width:100%;"
            onclick="verifyForgotOTP()">

            Verify OTP

          </button>

        </div>

      `;


  }catch(error){

    resetRecaptcha();

    showLoginAlert(
      getFirebaseError(error),
      "error"
    );

  }

};


window.verifyForgotOTP = async function(){

  const otp =
    document
      .getElementById("forgotOtp")
      ?.value
      .trim();


  if(!/^\d{6}$/.test(otp)){

    showLoginAlert(
      "সঠিক ৬ digit OTP দিন।",
      "error"
    );

    return;

  }


  try{

    const result =
      await confirmationResult.confirm(
        otp
      );


    currentUser =
      result.user;


    resetRecaptcha();


    document
      .getElementById("loginContent")
      .innerHTML = `

        <div class="login-step">

          <h3>
            OTP Verified
          </h3>

          <p>
            OTP verification successful।
          </p>

          <p style="font-size:13px;">
            Password reset-এর secure server-side
            flow পরবর্তী backend version-এ যুক্ত
            করা হবে।
          </p>

          <button
            class="primary-btn"
            style="width:100%;"
            onclick="renderSetPassword()">

            Continue

          </button>

        </div>

      `;


  }catch(error){

    showLoginAlert(
      getFirebaseError(error),
      "error"
    );

  }

};

window.openAccount = function(){

async function renderAccount(){

  const box =
    document.getElementById(
      "accountContent"
    );


  if(!currentUser){

    box.innerHTML = `

      <div class="empty">

        <p>
          You are not logged in.
        </p>

        <button
          class="primary-btn"
          style="margin-top:12px;"
          onclick="
            closeModal('accountModal');
            openLogin();
          ">

          Login

        </button>

      </div>

    `;

    return;

  }


  let userData = {};


  try{

    const snap =
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );


    if(snap.exists()){

      userData =
        snap.data();

    }

  }catch(error){

    console.error(error);

  }


  box.innerHTML = `

    <div class="summary">

      <div class="summary-row">

        <span>Mobile</span>

        <strong>
          ${escapeHtml(
            currentUser.phoneNumber || ""
          )}
        </strong>

      </div>

      <div class="summary-row">

        <span>Password Login</span>

        <strong>
          ${
            userData.hasPassword
              ? "Enabled"
              : "Not Set"
          }
        </strong>

      </div>

    </div>


    <button
      class="primary-btn"
      style="width:100%;margin-top:15px;"
      onclick="openOrdersFromAccount()">

      My Orders

    </button>


    <button
      class="danger-btn"
      style="width:100%;margin-top:10px;"
      onclick="logoutUser()">

      Logout

    </button>

  `;

}

/* =========================================================
   ORDERS
========================================================= */

window.openOrders = async function(){

  openModal("ordersModal");

  const box =
    document.getElementById(
      "ordersContent"
    );


  if(!currentUser){

    box.innerHTML = `

      <div class="empty">

        <p>
          Login করুন আপনার orders দেখতে।
        </p>

        <button
          class="primary-btn"
          style="margin-top:12px;"
          onclick="
            closeModal('ordersModal');
            openLogin();
          ">

          Login

        </button>

      </div>

    `;

    return;

  }


  box.innerHTML = `
    <div class="empty">
      Loading orders...
    </div>
  `;


  try{

    const q =
      query(
        collection(db,"orders"),
        where(
          "customerUid",
          "==",
          currentUser.uid
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snap =
      await getDocs(q);


    if(snap.empty){

      box.innerHTML = `
        <div class="empty">
          No orders yet.
        </div>
      `;

      return;

    }


    box.innerHTML = "";


    snap.forEach(orderSnap => {

      const order =
        orderSnap.data();


      const items =
        Array.isArray(order.items)
          ? order.items
          : [];


      const itemsHtml =
        items.map(item => `

          <div style="
            padding:5px 0;
            font-size:14px;
          ">

            ${escapeHtml(
              item.productName || ""
            )}

            ×
            ${item.qty || 0}

            ${
              item.weight
                ? " (" +
                  escapeHtml(item.weight) +
                  ")"
                : ""
            }

          </div>

        `).join("");


      const card =
        document.createElement("div");

      card.className =
        "order-card";


      card.innerHTML = `

        <div class="order-header">

          <strong>
            Order #${escapeHtml(
              orderSnap.id
                .slice(-8)
            )}
          </strong>

          <span class="status">
            ${escapeHtml(
              order.status || "pending"
            )}
          </span>

        </div>


        <div>
          ${itemsHtml}
        </div>


        <div class="summary">

          <div class="summary-row">

            <span>Total</span>

            <strong>
              ${money(order.total)}
            </strong>

          </div>

          <div class="summary-row">

            <span>Payment</span>

            <span>
              ${escapeHtml(
                order.paymentMethod || ""
              )}
            </span>

          </div>

        </div>

      `;


      box.appendChild(card);

    });


  }catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="empty">

        Orders load করা যায়নি।

        <br><br>

        Firebase যদি index তৈরি করতে বলে,
        Firebase Console-এর দেওয়া index link
        থেকে index create করুন।

      </div>

    `;

  }

};


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;


    if(user){

      try{

        await setDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {

            uid:user.uid,

            mobile:
              user.phoneNumber || "",

            updatedAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );

      }catch(error){

        console.error(
          "User save error:",
          error
        );

      }

    }

  }
);
