<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NatureBite</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f4ed;
  color:#183c2b;
}

header{
  background:#183c2b;
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.cartBtn{
  background:#fff;
  color:#183c2b;
  border:0;
  padding:10px 15px;
  border-radius:20px;
  font-weight:bold;
}

.hero{
  padding:35px 20px;
  text-align:center;
  background:#e9dfc9;
}

.hero h1{
  font-size:32px;
  margin-bottom:8px;
}

.hero p{
  color:#496352;
}

.controls{
  padding:18px;
  max-width:1000px;
  margin:auto;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:12px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.categories button{
  white-space:nowrap;
  padding:9px 14px;
  border:0;
  border-radius:20px;
  background:#dce8dd;
  color:#183c2b;
}

.categories button.active{
  background:#183c2b;
  color:white;
}

.products{
  max-width:1000px;
  margin:auto;
  padding:10px 18px 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.product{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.productImage{
  width:100%;
  height:180px;
  background:#eee8d8;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  margin-bottom:12px;
}

.product h3{
  margin-bottom:7px;
}

.description{
  font-size:13px;
  color:#68756c;
  min-height:35px;
}

.variantButtons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}

.variantBtn{
  border:1px solid #183c2b;
  background:white;
  color:#183c2b;
  padding:7px 10px;
  border-radius:8px;
}

.variantBtn.selected{
  background:#183c2b;
  color:white;
}

.price{
  font-size:20px;
  font-weight:bold;
  margin-bottom:5px;
}

.stock{
  font-size:13px;
  color:#69766d;
  margin-bottom:10px;
}

.addBtn{
  width:100%;
  padding:11px;
  background:#183c2b;
  color:white;
  border:0;
  border-radius:9px;
  font-weight:bold;
}

.addBtn:disabled{
  background:#aaa;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  overflow-y:auto;
}

.panel{
  background:#fff;
  width:94%;
  max-width:600px;
  margin:30px auto;
  border-radius:16px;
  padding:20px;
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
}

.cartItem{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:0;
  border-radius:6px;
  background:#dce8dd;
}

.remove{
  color:#b3261e;
  border:0;
  background:none;
}

.total{
  margin-top:15px;
  font-size:19px;
  font-weight:bold;
}

.checkoutBtn{
  width:100%;
  padding:13px;
  background:#183c2b;
  color:white;
  border:0;
  border-radius:10px;
  margin-top:15px;
  font-weight:bold;
}

.formGroup{
  margin-bottom:14px;
}

.formGroup label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
  font-size:14px;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:80px;
}

.paymentBox{
  display:grid;
  gap:8px;
}

.paymentOption{
  border:1px solid #ddd;
  padding:12px;
  border-radius:9px;
}

.summary{
  background:#f7f4ed;
  padding:14px;
  border-radius:10px;
  margin-top:15px;
}

.summaryRow{
  display:flex;
  justify-content:space-between;
  margin:7px 0;
}

.success{
  text-align:center;
  padding:20px;
}

.success h2{
  color:#183c2b;
  margin-bottom:10px;
}

.orderId{
  background:#e9f0e8;
  padding:12px;
  border-radius:8px;
  word-break:break-all;
  margin:15px 0;
}

.loading{
  text-align:center;
  padding:30px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">NatureBite</div>

  <button class="cartBtn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>Healthy Food, Naturally</h1>
  <p>Healthy snacks & nutritious food for everyday life.</p>
</section>

<section class="controls">

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Search products..."
    oninput="renderProducts()"
  >

  <div class="categories">
    <button
      class="active"
      onclick="selectCategory('All',this)"
    >
      All
    </button>

    <button
      onclick="selectCategory('Healthy Snacks',this)"
    >
      Healthy Snacks
    </button>

    <button
      onclick="selectCategory('Kids Special Foods',this)"
    >
      Kids Special Foods
    </button>

    <button
      onclick="selectCategory('Diabetic/Keto-Friendly Products',this)"
    >
      Diabetic/Keto
    </button>

    <button
      onclick="selectCategory('Instant Mix Items',this)"
    >
      Instant Mix
    </button>
  </div>

</section>

<section id="products" class="products">
  <div class="loading">
    Loading products...
  </div>
</section>


<!-- CART -->

<div id="cartOverlay" class="overlay">

  <div class="panel">

    <div class="panelHeader">
      <h2>Your Cart</h2>

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Product Total:
      ৳<span id="cartTotal">0</span>
    </div>

    <button
      class="checkoutBtn"
      onclick="openCheckout()"
    >
      Proceed to Checkout
    </button>

  </div>

</div>


<!-- CHECKOUT -->

<div id="checkoutOverlay" class="overlay">

  <div class="panel">

    <div class="panelHeader">

      <h2>Checkout</h2>

      <button
        class="close"
        onclick="closeCheckout()"
      >
        ×
      </button>

    </div>


    <div class="formGroup">

      <label>Full Name</label>

      <input
        id="customerName"
        type="text"
        placeholder="Enter your name"
      >

    </div>


    <div class="formGroup">

      <label>Mobile Number</label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="01XXXXXXXXX"
      >

    </div>


    <div class="formGroup">

      <label>District</label>

      <select id="district">

        <option value="">
          Select District
        </option>

        <option>Chattogram</option>
        <option>Dhaka</option>
        <option>Cumilla</option>
        <option>Cox's Bazar</option>
        <option>Feni</option>
        <option>Noakhali</option>

      </select>

    </div>


    <div class="formGroup">

      <label>Delivery Address</label>

      <textarea
        id="deliveryAddress"
        placeholder="House, road, area..."
      ></textarea>

    </div>


    <div class="formGroup">

      <label>Delivery Charge</label>

      <select
        id="deliveryCharge"
        onchange="updateCheckoutTotal()"
      >

        <option value="60">
          Standard Delivery — ৳60
        </option>

        <option value="80">
          Express Delivery — ৳80
        </option>

        <option value="0">
          Free Delivery — ৳0
        </option>

      </select>

    </div>


    <div class="formGroup">

      <label>Payment Method</label>

      <div class="paymentBox">

        <label class="paymentOption">
          <input
            type="radio"
            name="payment"
            value="COD"
            checked
            onchange="updateCheckoutTotal()"
          >
          Cash on Delivery
        </label>

        <label class="paymentOption">
          <input
            type="radio"
            name="payment"
            value="bKash"
            onchange="updateCheckoutTotal()"
          >
          bKash
        </label>

        <label class="paymentOption">
          <input
            type="radio"
            name="payment"
            value="Nagad"
            onchange="updateCheckoutTotal()"
          >
          Nagad
        </label>

      </div>

    </div>


    <div class="summary">

      <div class="summaryRow">
        <span>Products</span>
        <span>
          ৳<span id="checkoutProductTotal">0</span>
        </span>
      </div>

      <div class="summaryRow">
        <span>Delivery</span>
        <span>
          ৳<span id="checkoutDelivery">60</span>
        </span>
      </div>

      <hr>

      <div class="summaryRow">
        <strong>Total</strong>
        <strong>
          ৳<span id="checkoutGrandTotal">0</span>
        </strong>
      </div>

    </div>


    <button
      class="checkoutBtn"
      onclick="confirmOrder()"
    >
      Confirm Order
    </button>

  </div>

</div>


<!-- ORDER SUCCESS -->

<div id="successOverlay" class="overlay">

  <div class="panel success">

    <h2>🎉 Order Successful!</h2>

    <p>
      আপনার অর্ডার সফলভাবে গ্রহণ করা হয়েছে।
    </p>

    <div class="orderId">

      <strong>Order ID</strong>

      <br>

      <span id="successOrderId"></span>

    </div>

    <p>
      আপনার Order Status:
      <strong>Pending</strong>
    </p>

    <button
      class="checkoutBtn"
      onclick="closeSuccess()"
    >
      Done
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",

  authDomain:
  "naturebite-c5d88.firebaseapp.com",

  projectId:
  "naturebite-c5d88",

  storageBucket:
  "naturebite-c5d88.firebasestorage.app",

  messagingSenderId:
  "467003957826",

  appId:
  "1:467003957826:web:483a261d12ac396dca43db"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   GLOBAL DATA
========================= */

let products = [];
let variants = [];

let cart =
  JSON.parse(
    localStorage.getItem("naturebite_cart")
  ) || [];

let selectedCategory = "All";


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const productSnapshot =
      await getDocs(
        collection(db,"products")
      );

    products = [];

    productSnapshot.forEach(doc => {

      products.push({
        id:doc.id,
        ...doc.data()
      });

    });


    const variantSnapshot =
      await getDocs(
        collection(db,"product_variants")
      );

    variants = [];

    variantSnapshot.forEach(doc => {

      variants.push({
        id:doc.id,
        ...doc.data()
      });

    });


    renderProducts();

    updateCartUI();

  }catch(error){

    console.error(error);

    document.getElementById("products").innerHTML =
      `
      <div class="empty">
        Products load করা যায়নি।
        <br><br>
        Firebase Rules check করুন।
      </div>
      `;

  }

}


/* =========================
   CATEGORY
========================= */

window.selectCategory =
function(category,button){

  selectedCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderProducts();

};


/* =========================
   RENDER PRODUCTS
========================= */

window.renderProducts =
function(){

  const container =
    document.getElementById("products");

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  let filtered =
    products.filter(product => {

      const categoryMatch =
        selectedCategory === "All" ||
        product.category === selectedCategory;

      const searchMatch =
        product.name
          .toLowerCase()
          .includes(search);

      return categoryMatch && searchMatch;

    });


  if(filtered.length === 0){

    container.innerHTML =
      `
      <div class="empty">
        No products found.
      </div>
      `;

    return;

  }


  container.innerHTML =
    filtered.map(product => {

      const productVariants =
        variants.filter(
          v =>
          v.productId === product.id &&
          v.status === "available"
        );


      const firstVariant =
        productVariants[0];


      if(!firstVariant){

        return "";

      }


      return `

      <div class="product">

        <div class="productImage">
          🌿
        </div>

        <h3>
          ${escapeHTML(product.name)}
        </h3>

        <div class="description">
          ${escapeHTML(product.description || "")}
        </div>


        <div class="variantButtons">

          ${
            productVariants.map((v,index)=>`

              <button
                class="variantBtn ${index===0 ? "selected":""}"
                onclick="selectVariant(
                  '${product.id}',
                  '${v.id}',
                  this
                )"
              >
                ${escapeHTML(v.weight)}
              </button>

            `).join("")
          }

        </div>


        <div class="price">

          ৳<span
            id="price-${safeId(product.id)}"
          >
            ${firstVariant.price}
          </span>

        </div>


        <div class="stock">

          Stock:
          <span
            id="stock-${safeId(product.id)}"
          >
            ${firstVariant.stock}
          </span>

        </div>


        <button
          class="addBtn"
          id="add-${safeId(product.id)}"
          onclick="
            addToCart(
              '${product.id}',
              '${firstVariant.id}'
            )
          "
          ${firstVariant.stock <= 0 ? "disabled":""}
        >
          Add to Cart
        </button>

      </div>

      `;

    }).join("");

};


/* =========================
   SELECT VARIANT
========================= */

window.selectVariant =
function(productId,variantId,button){

  const productVariants =
    variants.filter(
      v =>
      v.productId === productId &&
      v.status === "available"
    );


  const selected =
    productVariants.find(
      v => v.id === variantId
    );


  if(!selected) return;


  document
    .querySelectorAll(
      `.variantButtons`
    )
    .forEach(group => {

      if(
        group
        .parentElement
        .querySelector("h3")
        ?.textContent
        === productId
      ){
        group
          .querySelectorAll("button")
          .forEach(b =>
            b.classList.remove("selected")
          );
      }

    });


  const card =
    button.closest(".product");


  card
    .querySelectorAll(".variantBtn")
    .forEach(b =>
      b.classList.remove("selected")
    );


  button.classList.add("selected");


  card
    .querySelector(".price span")
    .textContent =
      selected.price;


  card
    .querySelector(".stock span")
    .textContent =
      selected.stock;


  const addButton =
    card.querySelector(".addBtn");


  addButton.onclick =
    () =>
      addToCart(
        productId,
        variantId
      );


  addButton.disabled =
    selected.stock <= 0;

};


/* =========================
   ADD CART
========================= */

window.addToCart =
function(productId,variantId){

  const product =
    products.find(
      p => p.id === productId
    );

  const variant =
    variants.find(
      v => v.id === variantId
    );


  if(!product || !variant) return;


  if(variant.stock <= 0){

    alert("এই variant বর্তমানে stock out.");

    return;

  }


  const existing =
    cart.find(
      item =>
      item.variantId === variantId
    );


  if(existing){

    if(
      existing.quantity >=
      variant.stock
    ){

      alert("আর stock নেই.");

      return;

    }

    existing.quantity++;

  }else{

    cart.push({

      productId:
        product.id,

      productName:
        product.name,

      variantId:
        variant.id,

      weight:
        variant.weight,

      price:
        Number(variant.price),

      stock:
        Number(variant.stock),

      quantity:1

    });

  }


  saveCart();

  updateCartUI();

  alert("Cart-এ যোগ হয়েছে।");

};


/* =========================
   CART UI
========================= */

function saveCart(){

  localStorage.setItem(
    "naturebite_cart",
    JSON.stringify(cart)
  );

}


function updateCartUI(){

  const count =
    cart.reduce(
      (sum,item) =>
        sum + item.quantity,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent = count;


  const container =
    document.getElementById(
      "cartItems"
    );


  if(cart.length === 0){

    container.innerHTML =
      `
      <div class="empty">
        Your cart is empty.
      </div>
      `;

  }else{

    container.innerHTML =
      cart.map(
        (item,index)=>`

        <div class="cartItem">

          <div>

            <strong>
              ${escapeHTML(item.productName)}
            </strong>

            <br>

            <small>
              ${escapeHTML(item.weight)}
            </small>

            <br>

            ৳${item.price}

          </div>


          <div>

            <div class="qty">

              <button
                onclick="changeQty(${index},-1)"
              >
                −
              </button>

              <strong>
                ${item.quantity}
              </strong>

              <button
                onclick="changeQty(${index},1)"
              >
                +
              </button>

            </div>

            <button
              class="remove"
              onclick="removeCart(${index})"
            >
              Remove
            </button>

          </div>

        </div>

        `
      ).join("");

  }


  document.getElementById(
    "cartTotal"
  ).textContent =
    getProductTotal();

}


function getProductTotal(){

  return cart.reduce(
    (sum,item) =>
      sum +
      item.price *
      item.quantity,
    0
  );

}


/* =========================
   QUANTITY
========================= */

window.changeQty =
function(index,change){

  const item =
    cart[index];


  if(!item) return;


  const newQty =
    item.quantity + change;


  if(newQty <= 0){

    cart.splice(index,1);

  }else if(
    newQty <= item.stock
  ){

    item.quantity = newQty;

  }else{

    alert("এই product-এর আর stock নেই.");

    return;

  }


  saveCart();

  updateCartUI();

  updateCheckoutTotal();

};


window.removeCart =
function(index){

  cart.splice(index,1);

  saveCart();

  updateCartUI();

  updateCheckoutTotal();

};


/* =========================
   OPEN CART
========================= */

window.openCart =
function(){

  updateCartUI();

  document.getElementById(
    "cartOverlay"
  ).style.display = "block";

};


window.closeCart =
function(){

  document.getElementById(
    "cartOverlay"
  ).style.display = "none";

};


/* =========================
   CHECKOUT
========================= */

window.openCheckout =
function(){

  if(cart.length === 0){

    alert("আপনার Cart খালি।");

    return;

  }


  closeCart();

  updateCheckoutTotal();

  document.getElementById(
    "checkoutOverlay"
  ).style.display = "block";

};


window.closeCheckout =
function(){

  document.getElementById(
    "checkoutOverlay"
  ).style.display = "none";

};


/* =========================
   CHECKOUT TOTAL
========================= */

window.updateCheckoutTotal =
function(){

  const productTotal =
    getProductTotal();


  const delivery =
    Number(
      document.getElementById(
        "deliveryCharge"
      ).value
    );


  document.getElementById(
    "checkoutProductTotal"
  ).textContent =
    productTotal;


  document.getElementById(
    "checkoutDelivery"
  ).textContent =
    delivery;


  document.getElementById(
    "checkoutGrandTotal"
  ).textContent =
    productTotal + delivery;

};


/* =========================
   CONFIRM ORDER
========================= */

window.confirmOrder =
async function(){

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const district =
    document
      .getElementById("district")
      .value;


  const address =
    document
      .getElementById("deliveryAddress")
      .value
      .trim();


  const delivery =
    Number(
      document
        .getElementById("deliveryCharge")
        .value
    );


  const paymentMethod =
    document.querySelector(
      'input[name="payment"]:checked'
    )?.value;


  if(
    !name ||
    !phone ||
    !district ||
    !address ||
    !paymentMethod
  ){

    alert(
      "অনুগ্রহ করে সব তথ্য পূরণ করুন।"
    );

    return;

  }


  if(cart.length === 0){

    alert("আপনার Cart খালি।");

    return;

  }


  if(
    !/^01[3-9]\d{8}$/.test(phone)
  ){

    alert(
      "সঠিক ১১ সংখ্যার Mobile Number দিন।"
    );

    return;

  }


  const productTotal =
    getProductTotal();


  const grandTotal =
    productTotal +
    delivery;


  const orderItems =
    cart.map(item => ({

      productId:
        item.productId,

      productName:
        item.productName,

      variantId:
        item.variantId,

      weight:
        item.weight,

      price:
        Number(item.price),

      quantity:
        Number(item.quantity)

    }));


  try{

    const orderRef =
      await addDoc(
        collection(db,"orders"),
        {

          customerName:
            name,

          customerPhone:
            phone,

          district:
            district,

          address:
            address,

          items:
            orderItems,

          productTotal:
            productTotal,

          deliveryCharge:
            delivery,

          grandTotal:
            grandTotal,

          paymentMethod:
            paymentMethod,

          paymentStatus:
            paymentMethod === "COD"
              ? "cod_pending"
              : "pending",

          orderStatus:
            "pending",

          createdAt:
            serverTimestamp()

        }
      );


    document.getElementById(
      "successOrderId"
    ).textContent =
      orderRef.id;


    cart = [];

    saveCart();

    updateCartUI();


    document.getElementById(
      "checkoutOverlay"
    ).style.display =
      "none";


    document.getElementById(
      "successOverlay"
    ).style.display =
      "block";


    // Reset form

    document.getElementById(
      "customerName"
    ).value = "";

    document.getElementById(
      "customerPhone"
    ).value = "";

    document.getElementById(
      "district"
    ).value = "";

    document.getElementById(
      "deliveryAddress"
    ).value = "";


    document.querySelector(
      'input[value="COD"]'
    ).checked = true;


  }catch(error){

    console.error(
      "Order Error:",
      error
    );


    alert(
      "Order তৈরি করা যায়নি।\n\n" +
      "Firebase Rules এবং Internet connection check করুন।"
    );

  }

};


/* =========================
   SUCCESS
========================= */

window.closeSuccess =
function(){

  document.getElementById(
    "successOverlay"
  ).style.display =
    "none";

};


/* =========================
   HELPERS
========================= */

function safeId(text){

  return String(text)
    .replace(/[^a-zA-Z0-9]/g,"_");

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadProducts();

</script>
