<body>


<!-- HEADER -->

<header>

  <div class="header-inner">

    <div class="logo">
      NatureBite
    </div>

    <button
      type="button"
      class="cart-btn"
      id="openCartButton"
    >
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>
    Healthy Food, Naturally Better
  </h1>

  <p>
    Healthy snacks and nutritious food for everyday life.
  </p>

</section>


<!-- SEARCH -->

<div class="controls">

  <input
    id="search"
    type="search"
    placeholder="Search products..."
  >

  <select id="category">

    <option value="all">
      All Categories
    </option>

  </select>

</div>


<!-- PRODUCTS -->

<div
  id="products"
  class="products"
>

  <div class="empty">
    Loading products...
  </div>

</div>


<!-- CART OVERLAY -->

<div
  id="cartOverlay"
  class="cart-overlay"
></div>


<!-- CART -->

<div
  id="cartPanel"
  class="cart-panel"
>

  <div class="cart-header">

    <h2>
      Your Cart
    </h2>

    <button
      type="button"
      class="close-cart"
      id="closeCartButton"
    >
      ×
    </button>

  </div>


  <div
    id="cartItems"
    class="cart-items"
  >
  </div>


  <div class="cart-footer">

    <div class="total">

      <span>
        Total
      </span>

      <span>
        ৳<span id="cartTotal">0</span>
      </span>

    </div>


    <button
      type="button"
      class="checkout-btn"
      id="checkoutButton"
    >
      Proceed to Checkout
    </button>

  </div>

</div>



<script type="module">


/* FIREBASE */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",

  authDomain:
  "naturebite-c5d88.firebaseapp.com",

  projectId:
  "naturebite-c5d88",

  storageBucket:
  "naturebite-c5d88.firebasestorage.app",

  messagingSenderId:
  "467003957826",

  appId:
  "1:467003957826:web:483a261d12ac396dca43db"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);



/* GLOBAL DATA */

let products = [];

let variants = [];

let cart =
  JSON.parse(
    localStorage.getItem("naturebite_cart")
  ) || [];



/* DOM */

const productsContainer =
  document.getElementById("products");

const searchInput =
  document.getElementById("search");

const categorySelect =
  document.getElementById("category");

const cartCount =
  document.getElementById("cartCount");

const cartPanel =
  document.getElementById("cartPanel");

const cartOverlay =
  document.getElementById("cartOverlay");

const cartItems =
  document.getElementById("cartItems");

const cartTotal =
  document.getElementById("cartTotal");



/* LOAD FIRESTORE */

async function loadData() {

  try {

    const productsSnapshot =
      await getDocs(
        collection(db, "products")
      );


    const variantsSnapshot =
      await getDocs(
        collection(db, "product_variants")
      );


    products =
      productsSnapshot.docs.map(doc => ({

        id: doc.id,

        ...doc.data()

      }));


    variants =
      variantsSnapshot.docs.map(doc => ({

        id: doc.id,

        ...doc.data()

      }));


    console.log(
      "Products:",
      products
    );


    console.log(
      "Variants:",
      variants
    );


    buildCategories();

    renderProducts();

    renderCart();

  }

  catch(error) {

    console.error(
      "Firebase error:",
      error
    );


    productsContainer.innerHTML = `

      <div class="empty">

        <h3>
          Products load করা যাচ্ছে না
        </h3>

        <br>

        <p>
          ${error.code || ""}
        </p>

        <br>

        <p>
          ${error.message || ""}
        </p>

      </div>

    `;

  }

}



/* CATEGORIES */

function buildCategories() {

  const categoryNames = [

    ...new Set(

      products

        .map(
          product => product.category
        )

        .filter(Boolean)

    )

  ];


  categoryNames.forEach(
    categoryName => {

      const option =
        document.createElement("option");


      option.value =
        categoryName;


      option.textContent =
        categoryName;


      categorySelect.appendChild(
        option
      );

    }
  );

}



/* RENDER PRODUCTS */

function renderProducts() {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();


  const selectedCategory =
    categorySelect.value;


  const filteredProducts =
    products.filter(product => {

      const name =
        String(product.name || "")
          .toLowerCase();


      const description =
        String(product.description || "")
          .toLowerCase();


      const category =
        String(product.category || "");


      const searchMatch =
        name.includes(search) ||
        description.includes(search);


      const categoryMatch =
        selectedCategory === "all" ||
        category === selectedCategory;


      return (
        searchMatch &&
        categoryMatch
      );

    });


  productsContainer.innerHTML = "";


  if(filteredProducts.length === 0) {

    productsContainer.innerHTML = `

      <div class="empty">

        No products found.

      </div>

    `;

    return;

  }


  filteredProducts.forEach(
    product => {

      createProductCard(product);

    }
  );

}



/* PRODUCT CARD */

function createProductCard(product) {

  const productVariants =
    variants.filter(variant =>

      String(variant.productId) ===
      String(product.id)

    );


  const card =
    document.createElement("div");


  card.className =
    "product-card";


  if(productVariants.length === 0) {

    card.innerHTML = `

      <div class="product-image">
        NatureBite
      </div>

      <div class="product-content">

        <h3>
          ${product.name || ""}
        </h3>

        <div class="category-name">
          ${product.category || ""}
        </div>

        <div class="description">
          ${product.description || ""}
        </div>

        <div class="stock out">
          Variant unavailable
        </div>

      </div>

    `;


    productsContainer.appendChild(card);

    return;

  }


  let selectedVariant =
    productVariants[0];


  card.innerHTML = `

    <div class="product-image">
      NatureBite
    </div>


    <div class="product-content">

      <h3>
        ${product.name || ""}
      </h3>


      <div class="category-name">
        ${product.category || ""}
      </div>


      <div class="description">
        ${product.description || ""}
      </div>


      <div class="variants"></div>


      <div class="price">

        ৳<span class="price-value">
          ${selectedVariant.price}
        </span>

      </div>


      <div class="stock">

        Stock:
        <span class="stock-value">
          ${selectedVariant.stock}
        </span>

      </div>


      <button
        type="button"
        class="add-btn"
      >
        Add to Cart
      </button>

    </div>

  `;


  const variantContainer =
    card.querySelector(".variants");


  const priceValue =
    card.querySelector(".price-value");


  const stockValue =
    card.querySelector(".stock-value");


  const stockContainer =
    card.querySelector(".stock");


  const addButton =
    card.querySelector(".add-btn");



  /* VARIANT BUTTONS */

  productVariants.forEach(
    variant => {

      const button =
        document.createElement("button");


      button.type =
        "button";


      button.className =
        "variant-btn";


      button.textContent =
        variant.weight;


      if(
        variant.id ===
        selectedVariant.id
      ) {

        button.classList.add(
          "active"
        );

      }


      button.addEventListener(
        "click",
        function() {

          selectedVariant =
            variant;


          variantContainer
            .querySelectorAll(
              ".variant-btn"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          priceValue.textContent =
            selectedVariant.price;


          stockValue.textContent =
            selectedVariant.stock;


          updateStockUI();

        }
      );


      variantContainer.appendChild(
        button
      );

    }
  );



  /* STOCK UI */

  function updateStockUI() {

    const stock =
      Number(
        selectedVariant.stock
      );


    if(stock <= 0) {

      stockContainer.className =
        "stock out";


      addButton.disabled =
        true;


      addButton.textContent =
        "Out of Stock";

    }

    else {

      stockContainer.className =
        "stock available";


      addButton.disabled =
        false;


      addButton.textContent =
        "Add to Cart";

    }

  }


  updateStockUI();



  /* ADD TO CART */

  addButton.addEventListener(
    "click",
    function() {

      addToCart(
        product,
        selectedVariant
      );

    }
  );


  productsContainer.appendChild(
    card
  );

}



/* ADD TO CART */

function addToCart(
  product,
  variant
) {

  const existingItem =
    cart.find(item =>

      item.productId ===
      product.id &&

      item.variantId ===
      variant.id

    );


  if(existingItem) {

    const maxStock =
      Number(
        variant.stock
      );


    if(
      existingItem.quantity >=
      maxStock
    ) {

      alert(
        "Available stock এর বেশি নেওয়া যাবে না।"
      );

      return;

    }


    existingItem.quantity += 1;

  }

  else {

    cart.push({

      productId:
        product.id,

      productName:
        product.name,

      variantId:
        variant.id,

      weight:
        variant.weight,

      price:
        Number(variant.price),

      quantity:
        1

    });

  }


  saveCart();

  renderCart();

  openCart();

}



/* SAVE CART */

function saveCart() {

  localStorage.setItem(

    "naturebite_cart",

    JSON.stringify(cart)

  );

}



/* RENDER CART */

function renderCart() {

  cartItems.innerHTML = "";


  let total = 0;

  let count = 0;


  if(cart.length === 0) {

    cartItems.innerHTML = `

      <div class="empty">
        Your cart is empty.
      </div>

    `;

    cartTotal.textContent =
      "0";

    cartCount.textContent =
      "0";

    return;

  }


  cart.forEach(
    (item, index) => {

      const quantity =
        Number(item.quantity) || 1;


      const price =
        Number(item.price) || 0;


      const itemTotal =
        price * quantity;


      total += itemTotal;

      count += quantity;


      const itemElement =
        document.createElement("div");


      itemElement.className =
        "cart-item";


      itemElement.innerHTML = `

        <div class="cart-item-title">

          ${item.productName}

        </div>


        <div class="cart-item-info">

          ${item.weight}
          ×
          ৳${price}

        </div>


        <div class="quantity">


          <button
            type="button"
            class="minus-btn"
          >
            −
          </button>


          <strong>
            ${quantity}
          </strong>


          <button
            type="button"
            class="plus-btn"
          >
            +
          </button>


          <button
            type="button"
            class="remove-btn"
          >
            Remove
          </button>


        </div>


        <div class="item-total">

          ৳${itemTotal}

        </div>

      `;


      /* MINUS */

      itemElement
        .querySelector(".minus-btn")
        .addEventListener(
          "click",
          function() {

            changeQuantity(
              index,
              -1
            );

          }
        );



      /* PLUS */

      itemElement
        .querySelector(".plus-btn")
        .addEventListener(
          "click",
          function() {

            changeQuantity(
              index,
              1
            );

          }
        );



      /* REMOVE */

      itemElement
        .querySelector(".remove-btn")
        .addEventListener(
          "click",
          function() {

            removeItem(index);

          }
        );


      cartItems.appendChild(
        itemElement
      );

    }
  );


  cartTotal.textContent =
    total;


  cartCount.textContent =
    count;

}



/* CHANGE QUANTITY */

function changeQuantity(
  index,
  amount
) {

  if(
    !cart[index]
  ) {

    return;

  }


  const item =
    cart[index];


  const newQuantity =
    Number(item.quantity) +
    Number(amount);


  /* MINIMUM 1 */

  if(
    newQuantity < 1
  ) {

    return;

  }


  /* CHECK STOCK */

  const variant =
    variants.find(
      v =>
        String(v.id) ===
        String(item.variantId)
    );


  if(variant) {

    const stock =
      Number(variant.stock);


    if(
      newQuantity > stock
    ) {

      alert(
        `শুধু ${stock} টি stock available আছে।`
      );

      return;

    }

  }


  item.quantity =
    newQuantity;


  saveCart();

  renderCart();

}



/* REMOVE */

function removeItem(index) {

  if(
    !cart[index]
  ) {

    return;

  }


  cart.splice(
    index,
    1
  );


  saveCart();

  renderCart();

}



/* OPEN CART */

function openCart() {

  cartPanel.classList.add(
    "open"
  );


  cartOverlay.classList.add(
    "show"
  );

}



/* CLOSE CART */

function closeCart() {

  cartPanel.classList.remove(
    "open"
  );


  cartOverlay.classList.remove(
    "show"
  );

}



/* SEARCH */

searchInput.addEventListener(
  "input",
  function() {

    renderProducts();

  }
);



/* CATEGORY */

categorySelect.addEventListener(
  "change",
  function() {

    renderProducts();

  }
);



/* OPEN CART BUTTON */

document
  .getElementById(
    "openCartButton"
  )
  .addEventListener(
    "click",
    function() {

      openCart();

    }
  );



/* CLOSE CART BUTTON */

document
  .getElementById(
    "closeCartButton"
  )
  .addEventListener(
    "click",
    function() {

      closeCart();

    }
  );



/* OVERLAY */

cartOverlay.addEventListener(
  "click",
  function() {

    closeCart();

  }
);



/* CHECKOUT */

document
  .getElementById(
    "checkoutButton"
  )
  .addEventListener(
    "click",
    function() {

      if(cart.length === 0) {

        alert(
          "আপনার Cart খালি।"
        );

        return;

      }


      alert(
        "Checkout system পরের ধাপে তৈরি করা হবে।"
      );

    }
  );



/* START */

loadData();


</script>

</body>
</html>
