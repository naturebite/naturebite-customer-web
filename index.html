<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NatureBite — Healthy Food</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f4ec;
      color: #26382b;
    }

    header {
      background: #234d32;
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .cart-btn {
      border: none;
      background: white;
      color: #234d32;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
      background: #e9eadc;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #536456;
    }

    .controls {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    #search {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #ccd3c8;
      border-radius: 10px;
      font-size: 15px;
    }

    #category {
      padding: 12px;
      border: 1px solid #ccd3c8;
      border-radius: 10px;
      background: white;
    }

    .products {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .product-image {
      height: 180px;
      background: #e7e2d5;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #718071;
      font-size: 14px;
    }

    .product-content {
      padding: 15px;
    }

    .product-content h3 {
      margin-bottom: 7px;
    }

    .category-name {
      font-size: 12px;
      color: #718071;
      margin-bottom: 8px;
    }

    .description {
      font-size: 13px;
      color: #68736a;
      min-height: 38px;
      margin-bottom: 12px;
    }

    .variants {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .variant-btn {
      padding: 7px 10px;
      border: 1px solid #b8c6b9;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .variant-btn.active {
      background: #234d32;
      color: white;
      border-color: #234d32;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stock {
      font-size: 12px;
      margin-bottom: 10px;
    }

    .available {
      color: #23753c;
    }

    .out {
      color: #b52b2b;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #234d32;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
      grid-column: 1 / -1;
    }

    /* CART */

    .cart-panel {
      position: fixed;
      right: -420px;
      top: 0;
      width: min(420px, 100%);
      height: 100vh;
      background: white;
      z-index: 200;
      box-shadow: -5px 0 20px rgba(0,0,0,.2);
      transition: .3s;
      display: flex;
      flex-direction: column;
    }

    .cart-panel.open {
      right: 0;
    }

    .cart-header {
      background: #234d32;
      color: white;
      padding: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-cart {
      background: none;
      border: none;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .cart-item-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .cart-item-info {
      font-size: 13px;
      color: #667;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove {
      color: #b52b2b;
      border: none;
      background: none;
      margin-left: 10px;
      cursor: pointer;
    }

    .cart-footer {
      border-top: 1px solid #ddd;
      padding: 15px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .checkout-btn {
      width: 100%;
      padding: 13px;
      background: #234d32;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 150;
      display: none;
    }

    .cart-overlay.show {
      display: block;
    }

    @media(max-width:600px) {
      .hero h1 {
        font-size: 27px;
      }

      .products {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .product-image {
        height: 130px;
      }

      .product-content {
        padding: 10px;
      }

      .product-content h3 {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">NatureBite</div>

    <button class="cart-btn" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</header>

<section class="hero">
  <h1>Healthy Food, Naturally Better</h1>
  <p>Healthy snacks and nutritious food for everyday life.</p>
</section>

<div class="controls">
  <input
    type="text"
    id="search"
    placeholder="Search products..."
  >

  <select id="category">
    <option value="all">All Categories</option>
  </select>
</div>

<div id="products" class="products">
  <div class="empty">Loading products...</div>
</div>

<!-- CART -->

<div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>

<div id="cartPanel" class="cart-panel">

  <div class="cart-header">
    <h2>Your Cart</h2>

    <button class="close-cart" onclick="closeCart()">×</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">

    <div class="total">
      <span>Total</span>
      <span>৳<span id="cartTotal">0</span></span>
    </div>

    <button class="checkout-btn" onclick="checkout()">
      Proceed to Checkout
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",
  authDomain: "naturebite-c5d88.firebaseapp.com",
  projectId: "naturebite-c5d88",
  storageBucket: "naturebite-c5d88.firebasestorage.app",
  messagingSenderId: "467003957826",
  appId: "1:467003957826:web:483a261d12ac396dca43db"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* DATA */

let products = [];
let variants = [];
let cart = JSON.parse(localStorage.getItem("naturebite_cart")) || [];


/* LOAD PRODUCTS */

async function loadProducts() {

  try {

    const productSnapshot =
      await getDocs(collection(db, "products"));

    const variantSnapshot =
      await getDocs(collection(db, "product_variants"));

    products = [];

    productSnapshot.forEach(doc => {

      products.push({
        id: doc.id,
        ...doc.data()
      });

    });

    variants = [];

    variantSnapshot.forEach(doc => {

      variants.push({
        id: doc.id,
        ...doc.data()
      });

    });

    createCategories();

    renderProducts();

    updateCart();

  } catch(error) {

    console.error(error);

    document.getElementById("products").innerHTML = `
      <div class="empty">
        <h3>Products load করা যাচ্ছে না</h3>
        <p>${error.code || ""}</p>
        <p>${error.message || ""}</p>
      </div>
    `;

  }

}


/* CATEGORY */

function createCategories() {

  const select = document.getElementById("category");

  const categories = [
    ...new Set(
      products
        .map(product => product.category)
        .filter(Boolean)
    )
  ];

  categories.forEach(category => {

    const option = document.createElement("option");

    option.value = category;
    option.textContent = category;

    select.appendChild(option);

  });

}


/* RENDER */

function renderProducts() {

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const selectedCategory =
    document.getElementById("category").value;


  const filtered =
    products.filter(product => {

      const name =
        (product.name || "").toLowerCase();

      const description =
        (product.description || "").toLowerCase();

      const category =
        product.category || "";


      const matchesSearch =
        name.includes(search) ||
        description.includes(search);

      const matchesCategory =
        selectedCategory === "all" ||
        category === selectedCategory;


      return matchesSearch && matchesCategory;

    });


  if(filtered.length === 0) {

    container.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;

  }


  container.innerHTML = "";


  filtered.forEach(product => {

    const productVariants =
      variants.filter(
        variant =>
          variant.productId === product.id &&
          variant.status !== "inactive"
      );


    if(productVariants.length === 0) {

      container.innerHTML += `
        <div class="product-card">

          <div class="product-image">
            NatureBite
          </div>

          <div class="product-content">

            <h3>${product.name}</h3>

            <div class="category-name">
              ${product.category || ""}
            </div>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="stock out">
              Variant unavailable
            </div>

          </div>

        </div>
      `;

      return;

    }


    const firstVariant =
      productVariants[0];


    const card =
      document.createElement("div");

    card.className = "product-card";


    card.innerHTML = `

      <div class="product-image">
        NatureBite
      </div>

      <div class="product-content">

        <h3>${product.name}</h3>

        <div class="category-name">
          ${product.category || ""}
        </div>

        <div class="description">
          ${product.description || ""}
        </div>

        <div class="variants"></div>

        <div class="price">
          ৳<span class="selected-price">
            ${firstVariant.price}
          </span>
        </div>

        <div class="stock">
          Stock:
          <span class="selected-stock">
            ${firstVariant.stock}
          </span>
        </div>

        <button class="add-btn">
          Add to Cart
        </button>

      </div>

    `;


    const variantBox =
      card.querySelector(".variants");

    const priceElement =
      card.querySelector(".selected-price");

    const stockElement =
      card.querySelector(".selected-stock");

    const addButton =
      card.querySelector(".add-btn");


    let selectedVariant =
      firstVariant;


    /* VARIANT BUTTONS */

    productVariants.forEach(variant => {

      const button =
        document.createElement("button");

      button.className = "variant-btn";

      if(variant.id === firstVariant.id) {
        button.classList.add("active");
      }

      button.textContent =
        variant.weight;


      button.addEventListener("click", () => {

        selectedVariant = variant;


        card
          .querySelectorAll(".variant-btn")
          .forEach(btn =>
            btn.classList.remove("active")
          );


        button.classList.add("active");


        priceElement.textContent =
          variant.price;

        stockElement.textContent =
          variant.stock;


        if(Number(variant.stock) <= 0) {

          addButton.disabled = true;
          addButton.textContent = "Out of Stock";

        } else {

          addButton.disabled = false;
          addButton.textContent = "Add to Cart";

        }

      });


      variantBox.appendChild(button);

    });


    /* INITIAL STOCK */

    if(Number(firstVariant.stock) <= 0) {

      addButton.disabled = true;
      addButton.textContent = "Out of Stock";

    }


    /* ADD TO CART */

    addButton.addEventListener("click", () => {

      addToCart(product, selectedVariant);

    });


    container.appendChild(card);

  });

}


/* ADD CART */

function addToCart(product, variant) {

  const existing =
    cart.find(
      item =>
        item.productId === product.id &&
        item.variantId === variant.id
    );


  if(existing) {

    if(existing.quantity < Number(variant.stock)) {

      existing.quantity++;

    } else {

      alert("Maximum available stock reached.");

    }

  } else {

    cart.push({

      productId: product.id,

      productName: product.name,

      variantId: variant.id,

      weight: variant.weight,

      price: Number(variant.price),

      quantity: 1

    });

  }


  saveCart();

  updateCart();

  openCart();

}


/* SAVE CART */

function saveCart() {

  localStorage.setItem(
    "naturebite_cart",
    JSON.stringify(cart)
  );

}


/* UPDATE CART */

function updateCart() {

  document.getElementById("cartCount").textContent =
    cart.reduce(
      (sum, item) => sum + item.quantity,
      0
    );


  const container =
    document.getElementById("cartItems");


  if(cart.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Your cart is empty.
      </div>
    `;

    document.getElementById("cartTotal").textContent = "0";

    return;

  }


  container.innerHTML = "";


  let total = 0;


  cart.forEach((item, index) => {

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;


    const div =
      document.createElement("div");

    div.className = "cart-item";


    div.innerHTML = `

      <div class="cart-item-title">
        ${item.productName}
      </div>

      <div class="cart-item-info">
        ${item.weight} × ৳${item.price}
      </div>

      <div class="quantity">

        <button data-action="minus">
          −
        </button>

        <strong>
          ${item.quantity}
        </strong>

        <button data-action="plus">
          +
        </button>

        <button class="remove">
          Remove
        </button>

      </div>

      <div style="margin-top:6px;font-weight:bold;">
        ৳${itemTotal}
      </div>

    `;


    div
      .querySelector('[data-action="minus"]')
      .onclick = () => changeQuantity(index, -1);


    div
      .querySelector('[data-action="plus"]')
      .onclick = () => changeQuantity(index, 1);


    div
      .querySelector(".remove")
      .onclick = () => removeItem(index);


    container.appendChild(div);

  });


  document.getElementById("cartTotal").textContent =
    total;

}


/* QUANTITY */

function changeQuantity(index, amount) {

  const item = cart[index];

  item.quantity += amount;


  if(item.quantity <= 0) {

    cart.splice(index, 1);

  }


  saveCart();

  updateCart();

}


/* REMOVE */

function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

  updateCart();

}


/* CART OPEN */

window.openCart = function() {

  document
    .getElementById("cartPanel")
    .classList.add("open");

  document
    .getElementById("cartOverlay")
    .classList.add("show");

};


/* CART CLOSE */

window.closeCart = function() {

  document
    .getElementById("cartPanel")
    .classList.remove("open");

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

};


/* CHECKOUT */

window.checkout = function() {

  if(cart.length === 0) {

    alert("Your cart is empty.");

    return;

  }


  alert(
    "Checkout system will be connected in the next step."
  );

};


/* SEARCH */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderProducts
  );


/* CATEGORY */

document
  .getElementById("category")
  .addEventListener(
    "change",
    renderProducts
  );


/* START */

loadProducts();

</script>

</body>
</html>
```
