<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NatureBite</title>

<style>
:root{
  --green:#1f5d3a;
  --green2:#2f7d50;
  --cream:#f6f1e4;
  --bg:#fafbf8;
  --text:#173326;
  --muted:#718078;
  --border:#e2e7e2;
  --danger:#c62828;
  --white:#fff;
  --shadow:0 8px 25px rgba(20,60,40,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  font-size:23px;
  font-weight:800;
  color:var(--green);
  white-space:nowrap;
}

.spacer{
  flex:1;
}

.navBtn{
  position:relative;
  background:var(--cream);
  color:var(--green);
  border:0;
  border-radius:11px;
  padding:10px 12px;
}

.badge{
  position:absolute;
  right:-4px;
  top:-5px;
  background:#d32f2f;
  color:#fff;
  min-width:18px;
  height:18px;
  border-radius:50%;
  font-size:10px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.hero{
  background:linear-gradient(135deg,#edf6ea,#fff);
  padding:42px 16px;
}

.heroInner{
  max-width:1150px;
  margin:auto;
}

.hero h1{
  font-size:40px;
  margin:0 0 10px;
}

.hero p{
  color:var(--muted);
  max-width:700px;
  line-height:1.7;
}

.searchBox{
  max-width:720px;
  display:flex;
  gap:8px;
}

.searchBox input{
  flex:1;
}

main{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 70px;
}

.section{
  margin-bottom:30px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.sectionHead h2{
  margin:0;
}

.categoryBar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
}

.chip{
  background:#fff;
  border:1px solid var(--border);
  padding:9px 14px;
  border-radius:30px;
  white-space:nowrap;
}

.chip.active{
  background:var(--green);
  color:#fff;
}

.productGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.productImage{
  height:190px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--cream);
  font-size:55px;
}

.productImage img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cardBody{
  padding:14px;
}

.cardBody h3{
  margin:0 0 5px;
  font-size:17px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.price{
  color:var(--green);
  font-weight:800;
  font-size:20px;
  margin:9px 0;
}

.btn{
  background:var(--green);
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px 14px;
}

.btn.secondary{
  background:var(--cream);
  color:var(--green);
}

.btn.danger{
  background:#fff0ef;
  color:var(--danger);
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.full{
  width:100%;
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
}

.row>*{
  flex:1;
}

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:flex-end;
}

.overlay.center{
  justify-content:center;
  align-items:center;
}

.panel{
  width:min(540px,100%);
  height:100%;
  overflow-y:auto;
  background:#fff;
  padding:20px;
}

.center .panel{
  height:auto;
  max-height:92vh;
  border-radius:18px;
}

.closeBtn{
  float:right;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.formGrid .full{
  grid-column:1/-1;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #d9ded9;
  border-radius:10px;
  background:#fff;
  outline:none;
}

label{
  display:block;
  margin-bottom:5px;
  font-size:13px;
  font-weight:bold;
}

.item{
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:31px;
  height:31px;
  border:0;
  border-radius:8px;
  background:var(--cream);
  color:var(--green);
}

.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  background:#edf7ef;
  color:var(--green);
  font-size:12px;
}

.notice{
  padding:12px;
  background:#fff7dc;
  border-radius:10px;
  margin:10px 0;
}

.success{
  padding:12px;
  background:#edf8ef;
  color:#245d39;
  border-radius:10px;
}

.error{
  padding:12px;
  background:#fff0ef;
  color:#a5221c;
  border-radius:10px;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
}

.tab{
  padding:8px 10px;
  background:#f0f2ef;
  border-radius:8px;
  white-space:nowrap;
  font-size:12px;
}

.tab.active{
  background:var(--green);
  color:#fff;
}

footer{
  text-align:center;
  padding:30px;
  border-top:1px solid var(--border);
  color:var(--muted);
}

@media(max-width:900px){
  .productGrid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .logo{
    font-size:19px;
  }

  .navBtn{
    padding:9px;
    font-size:12px;
  }

  .hero h1{
    font-size:30px;
  }

  .productGrid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .productImage{
    height:150px;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .formGrid .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">🌿 NatureBite</div>

<div class="spacer"></div>

<button class="navBtn" onclick="openWishlist()">♡ Wishlist</button>

<button class="navBtn" onclick="openOrders()">📦 Orders</button>

<button class="navBtn" onclick="openAccount()">👤 Account</button>

<button class="navBtn" onclick="openCart()">
🛒 Cart
<span id="cartBadge" class="badge">0</span>
</button>

</div>
</header>


<div class="hero">

<div class="heroInner">

<h1>Healthy food, naturally.</h1>

<p>
Healthy Snacks, Kids Special Foods,
Diabetic/Keto-Friendly Products এবং
Instant Mix Items — সবকিছু সহজে অর্ডার করুন।
</p>

<div class="searchBox">

<input
id="searchInput"
placeholder="পণ্য খুঁজুন..."
oninput="renderProducts()"
>

<button class="btn" onclick="openOffers()">
🎁 Offers
</button>

</div>

</div>

</div>


<main>

<div class="section">

<div class="sectionHead">
<h2>Categories</h2>
</div>

<div id="categories" class="categoryBar"></div>

</div>


<div class="section">

<div class="sectionHead">

<h2>Products</h2>

<span id="productCount" class="muted"></span>

</div>

<div id="products" class="productGrid"></div>

</div>


<div class="section">

<div class="sectionHead">
<h2>Quick Access</h2>
</div>

<div class="row">

<button class="btn secondary" onclick="openOffers()">
🎁 Offers
</button>

<button class="btn secondary" onclick="openSupport()">
💬 Support
</button>

<button class="btn secondary" onclick="openWheel()">
🎡 Lucky Wheel
</button>

</div>

</div>

</main>


<footer>
© <span id="year"></span> NatureBite
</footer>


<div id="overlay" class="overlay hidden">

<div id="panel" class="panel"></div>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
getDoc,
doc,
setDoc,
addDoc,
query,
where,
limit,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged,
signInWithPhoneNumber,
RecaptchaVerifier,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig={

apiKey:"AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",

authDomain:"naturebite-c5d88.firebaseapp.com",

projectId:"naturebite-c5d88",

storageBucket:"naturebite-c5d88.firebasestorage.app",

messagingSenderId:"467003957826",

appId:"1:467003957826:web:483a261d12ac396dca43db"

};


const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);


let products=[];
let variants=[];
let categories=[];
let user=null;

let cart=
JSON.parse(
localStorage.getItem("naturebite_cart") || "[]"
);

let selectedCategory="all";
let wishlist=[];
let appliedCoupon=null;

let delivery={
type:"standard",
fee:60
};


const $=id=>document.getElementById(id);


function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return "৳"+Number(value||0).toFixed(0);

}


function saveCart(){

localStorage.setItem(
"naturebite_cart",
JSON.stringify(cart)
);

updateCartBadge();

}


function updateCartBadge(){

$("cartBadge").textContent=
cart.reduce((sum,item)=>sum+item.qty,0);

}


function showPanel(html,center=false){

$("panel").innerHTML=html;

$("overlay").classList.remove("hidden");

$("overlay").classList.toggle("center",center);

}


function closePanel(){

$("overlay").classList.add("hidden");

$("overlay").classList.remove("center");

}


$("overlay").addEventListener("click",e=>{

if(e.target===$("overlay")){
closePanel();
}

});


async function loadData(){

try{

const [p,v,c]=await Promise.all([

getDocs(collection(db,"products")),

getDocs(collection(db,"product_variants")),

getDocs(collection(db,"categories"))

]);


products=p.docs.map(d=>({
id:d.id,
...d.data()
}));


variants=v.docs.map(d=>({
id:d.id,
...d.data()
}));


categories=c.docs.map(d=>({
id:d.id,
...d.data()
}));


renderCategories();

renderProducts();

updateCartBadge();

}catch(error){

console.error(error);

$("products").innerHTML=
`<div class="error">
Products load করা যায়নি।
</div>`;

}

}


function renderCategories(){

const list=[
{
id:"all",
name:"All"
},
...categories
.filter(c=>c.status!=="inactive")
.sort(
(a,b)=>(a.sortOrder||0)-(b.sortOrder||0)
)
];


$("categories").innerHTML=

list.map(c=>`

<button
class="chip ${selectedCategory===c.id?"active":""}"
onclick="selectCategory('${escapeHTML(c.id)}')"
>
${escapeHTML(c.name)}
</button>

`).join("");

}


window.selectCategory=function(id){

selectedCategory=id;

renderCategories();

renderProducts();

};


window.renderProducts=function(){

const search=
$("searchInput")
.value
.trim()
.toLowerCase();


let list=
products.filter(
p=>p.status!=="inactive"
);


if(selectedCategory!=="all"){

const category=
categories.find(
c=>c.id===selectedCategory
);


list=list.filter(
p=>
p.category===selectedCategory ||
p.category===category?.name
);

}


if(search){

list=list.filter(p=>

(p.name||"")
.toLowerCase()
.includes(search)

||

(p.description||"")
.toLowerCase()
.includes(search)

||

(p.category||"")
.toLowerCase()
.includes(search)

);

}


$("productCount").textContent=
list.length+"টি";


if(!list.length){

$("products").innerHTML=
`<div class="notice">
কোনো পণ্য পাওয়া যায়নি।
</div>`;

return;

}


$("products").innerHTML=

list.map(p=>{

const vs=
variants.filter(
v=>
v.productId===p.id &&
v.status!=="inactive"
);


const minPrice=
vs.length
?
Math.min(...vs.map(v=>Number(v.price||0)))
:
0;


return `

<div class="card">

<div class="productImage">

${
p.imageUrl
?
`<img
src="${escapeHTML(p.imageUrl)}"
alt="${escapeHTML(p.name)}"
>`
:
"🌿"
}

</div>


<div class="cardBody">

<h3>
${escapeHTML(p.name)}
</h3>

<div class="muted">
${escapeHTML(p.category||"")}
</div>

<div class="price">
${money(minPrice)}
${vs.length?" থেকে":""}
</div>


<button
class="btn full"
onclick="openProduct('${escapeHTML(p.id)}')"
>
View Product
</button>

</div>

</div>

`;

}).join("");

};


window.openProduct=function(productId){

const product=
products.find(p=>p.id===productId);

if(!product)return;


const vs=
variants.filter(
v=>
v.productId===productId &&
v.status!=="inactive"
);


showPanel(`

<button class="closeBtn" onclick="closePanel()">×</button>

<h2>${escapeHTML(product.name)}</h2>

<div
class="productImage"
style="height:230px"
>

${
product.imageUrl
?
`<img src="${escapeHTML(product.imageUrl)}">`
:
"🌿"
}

</div>


<p class="muted">
${escapeHTML(product.description||"")}
</p>


<div class="formGrid">

<div class="full">

<label>Variant নির্বাচন করুন</label>

<select id="variantSelect"
onchange="updateVariant()">

${vs.map(v=>`

<option value="${escapeHTML(v.id)}">

${escapeHTML(v.weight)}
—
${money(v.price)}
—
Stock ${Number(v.stock||0)}

</option>

`).join("")}

</select>

</div>


<div
id="variantInfo"
class="full"
></div>


<div class="row full">

<button
class="btn"
onclick="addSelectedToCart('${escapeHTML(productId)}')"
>
Add to Cart
</button>

<button
class="btn secondary"
onclick="addWishlist('${escapeHTML(productId)}')"
>
♡ Wishlist
</button>

</div>

</div>

`);

updateVariant();

};


window.updateVariant=function(){

const select=$("variantSelect");

if(!select)return;


const variant=
variants.find(
v=>v.id===select.value
);


if(!variant)return;


$("variantInfo").innerHTML=

Number(variant.stock||0)>0

?

`<div class="success">
<b>${money(variant.price)}</b>
· ${escapeHTML(variant.weight)}
· Stock ${Number(variant.stock)}
</div>`

:

`<div class="error">
এই variant বর্তমানে Out of Stock.
</div>`;

};


window.addSelectedToCart=function(productId){

const variant=
variants.find(
v=>v.id===$("variantSelect").value
);


if(!variant)return;


if(Number(variant.stock||0)<=0){

alert("এই variant বর্তমানে stock-এ নেই।");

return;

}


const existing=
cart.find(
i=>i.variantId===variant.id
);


if(existing){

existing.qty=
Math.min(
existing.qty+1,
Number(variant.stock)
);

}else{

cart.push({

productId,

variantId:variant.id,

qty:1

});

}


saveCart();

alert("Cart-এ যোগ হয়েছে।");

};


window.openCart=function(){

const items=getCartItems();


const subtotal=
items.reduce(
(sum,i)=>
sum+
Number(i.variant.price)*i.qty,
0
);


showPanel(`

<button class="closeBtn" onclick="closePanel()">×</button>

<h2>🛒 Shopping Cart</h2>

${
items.length
?

items.map(i=>`

<div class="item">

<b>
${escapeHTML(i.product.name)}
</b>

<div class="muted">
${escapeHTML(i.variant.weight)}
· ${money(i.variant.price)}
</div>

<div
class="row"
style="margin-top:8px"
>

<div class="qty">

<button
onclick="changeQty('${escapeHTML(i.variant.id)}',-1)"
>
−
</button>

<b>${i.qty}</b>

<button
onclick="changeQty('${escapeHTML(i.variant.id)}',1)"
>
+
</button>

</div>

<b>
${money(i.variant.price*i.qty)}
</b>

<button
class="btn danger"
onclick="removeFromCart('${escapeHTML(i.variant.id)}')"
>
Remove
</button>

</div>

</div>

`).join("")

:

`<div class="notice">
আপনার Cart বর্তমানে খালি।
</div>`

}


<div class="item">

<b>
Subtotal: ${money(subtotal)}
</b>

</div>


<button
class="btn full"
${items.length?"":"disabled"}
onclick="openCheckout()"
>
Checkout
</button>

`);

};


function getCartItems(){

return cart.map(item=>{

const variant=
variants.find(
v=>v.id===item.variantId
);

const product=
products.find(
p=>p.id===item.productId
);


if(!variant||!product)return null;


return {
...item,
variant,
product
};

}).filter(Boolean);

}


window.changeQty=function(id,direction){

const item=
cart.find(
i=>i.variantId===id
);

const variant=
variants.find(
v=>v.id===id
);


if(!item)return;


item.qty=
Math.max(
1,
Math.min(
item.qty+direction,
Number(variant?.stock||99)
)
);


saveCart();

openCart();

};


window.removeFromCart=function(id){

cart=
cart.filter(
i=>i.variantId!==id
);

saveCart();

openCart();

};


window.openCheckout=function(){

if(!user){

openLogin(
"Order করতে Customer login করুন।"
);

return;

}


const items=getCartItems();

if(!items.length)return;


showPanel(`

<button class="closeBtn" onclick="closePanel()">×</button>

<h2>Checkout</h2>


<form
onsubmit="placeOrder(event)"
>

<div class="formGrid">


<div>

<label>Full Name</label>

<input
id="fullName"
required
placeholder="আপনার নাম"
>

</div>


<div>

<label>Mobile Number</label>

<input
id="mobile"
required
value="${escapeHTML(user.phoneNumber||"")}"
>

</div>


<div>

<label>District</label>

<select id="district">

<option>Chattogram</option>
<option>Dhaka</option>
<option>Cumilla</option>
<option>Cox's Bazar</option>
<option>Feni</option>
<option>Noakhali</option>

</select>

</div>


<div>

<label>Delivery Type</label>

<select
id="deliveryType"
onchange="calculateCheckout()"
>

<option value="standard">
Standard — ৳60
</option>

<option value="express">
Express — ৳80
</option>

<option value="free">
Free Delivery — ৳0
</option>

</select>

</div>


<div class="full">

<label>Delivery Address</label>

<textarea
id="address"
rows="4"
required
placeholder="সম্পূর্ণ ঠিকানা"
></textarea>

</div>


<div>

<label>Payment Method</label>

<select
id="paymentMethod"
onchange="paymentFields()"
>

<option value="cod">
Cash on Delivery
</option>

<option value="bkash">
bKash
</option>

<option value="nagad">
Nagad
</option>

</select>

</div>


<div id="transactionBox" class="hidden">

<label>Transaction ID</label>

<input
id="transactionId"
placeholder="Online payment হলে Transaction ID দিন"
>

</div>


<div class="full">

<label>Coupon Code</label>

<div class="row">

<input
id="couponCode"
placeholder="NATURE10"
>

<button
type="button"
class="btn secondary"
onclick="applyCoupon()"
>
Apply
</button>

</div>

<div
id="couponMessage"
class="muted"
style="margin-top:5px"
></div>

</div>


</div>


<div
id="checkoutSummary"
class="notice"
style="margin-top:15px"
></div>


<button
class="btn full"
type="submit"
>
Confirm Order
</button>


</form>

`);

calculateCheckout();

};


window.calculateCheckout=function(){

const type=
$("deliveryType")?.value ||
"standard";


delivery.type=type;

delivery.fee=
type==="express"
?
80
:
type==="free"
?
0
:
60;


updateCheckoutSummary();

};


window.paymentFields=function(){

const method=
$("paymentMethod").value;

function updateCheckoutSummary(){

if(!$("checkoutSummary"))return;


const subtotal=
getCartItems()
.reduce(
(sum,i)=>
sum+
Number(i.variant.price)*i.qty,
0
);


const discount=
appliedCoupon
?
Math.min(
Number(appliedCoupon.discount||0),
subtotal
)
:
0;


const total=
Math.max(
0,
subtotal-discount
)
+
delivery.fee;


$("checkoutSummary").innerHTML=`

Subtotal:
${money(subtotal)}
<br>

Discount:
-${money(discount)}
<br>

Delivery:
${money(delivery.fee)}
<br>

<b>
Total:
${money(total)}
</b>

`;

}


window.applyCoupon=async function(){

const code=
$("couponCode")
.value
.trim()
.toUpperCase();


if(!code)return;


let coupon=null;


try{

const q=query(
collection(db,"coupons"),
where("code","==",code),
limit(1)
);


const result=
await getDocs(q);


if(!result.empty){

coupon={
id:result.docs[0].id,
...result.docs[0].data()
};

}

}catch(error){

console.error(error);

}


if(!coupon){

const demoCoupons={

NATURE10:{
type:"percent",
value:10,
minOrder:300,
active:true
},

WELCOME50:{
type:"fixed",
value:50,
minOrder:500,
active:true
}

};


coupon=demoCoupons[code];

}


const subtotal=
getCartItems()
.reduce(
(sum,i)=>
sum+
Number(i.variant.price)*i.qty,
0
);


if(!coupon){

$("couponMessage").textContent=
"Coupon পাওয়া যায়নি।";

return;

}


if(coupon.active===false){

$("couponMessage").textContent=
"Coupon inactive।";

return;

}


if(
coupon.expiresAt &&
coupon.expiresAt.seconds &&
Date.now() >
coupon.expiresAt.seconds*1000
){

$("couponMessage").textContent=
"Coupon expired।";

return;

}


if(
subtotal <
Number(coupon.minOrder||0)
){

$("couponMessage").textContent=
`Minimum order ${money(coupon.minOrder)} লাগবে।`;

return;

}


let discount=0;


if(coupon.type==="percent"){

discount=
subtotal*
Number(coupon.value||0)/
100;

}else{

discount=
Number(coupon.value||0);

}


appliedCoupon={
...coupon,
code,
discount
};


$("couponMessage").textContent=
`Coupon applied: ${code} (-${money(discount)})`;


updateCheckoutSummary();

};


window.placeOrder=async function(event){

getCartItems();

alert("Cart খালি।");

return;

}


for(const item of items){

if(
item.qty >
Number(item.variant.stock||0)
){

alert(
item.product.name+
" এর পর্যাপ্ত stock নেই।"
);

return;

}

}


const subtotal=
items.reduce(
(sum,i)=>
sum+
Number(i.variant.price)*i.qty,
0
);


const discount=
appliedCoupon
?
Math.min(
Number(appliedCoupon.discount||0),
subtotal
)
:
0;


const total=
Math.max(
0,
subtotal-discount
)
+
delivery.fee;


const paymentMethod=
$("paymentMethod").value;


const transactionId=
$("transactionId")?.value.trim() ||
"";

paymentMethod!=="cod" &&

productName:i.product.name,

variantId:i.variant.id,

weight:i.variant.weight,

qty:i.qty,

price:Number(i.variant.price)

})),

subtotal,

discount,

couponCode:
appliedCoupon?.code||null,

deliveryType:
delivery.type,

deliveryFee:
delivery.fee,

total,

paymentMethod,

paymentTransactionId:
transactionId,

paymentStatus:
paymentMethod==="cod"
?
"cod_pending"
:
"pending_verification",

status:"pending",

createdAt:
serverTimestamp()

};


const orderRef=
await addDoc(
collection(db,"orders"),
order
);


cart=[];

appliedCoupon=null;

saveCart();


showPanel(`

<div class="success">

<h2>
🎉 Order Successful
</h2>

<p>
আপনার Order সফলভাবে নেওয়া হয়েছে।

Order ID:
<b>${escapeHTML(orderRef.id)}</b>
</p>

<button
class="btn"
onclick="openOrders()"
>
My Orders
</button>

</div>

`,true);


}catch(error){

console.error(error);

alert(
"Order save করা যায়নি। Firestore Rules পরীক্ষা করুন।"
);

window.addWishlist=async function(productId){

openLogin(
"Wishlist ব্যবহার করতে login করুন।"
);

return;

}


try{

const ref=
doc(db,"wishlists",user.uid);


const snap=
await getDoc(ref);


let ids=
snap.exists()
?
snap.data().productIds||[]
:
[];


if(ids.includes(productId)){

ids=
ids.filter(id=>id!==productId);

alert("Wishlist থেকে remove হয়েছে।");

}else{

ids.push(productId);

alert("Wishlist-এ যোগ হয়েছে।");

}


await setDoc(
ref,
{
productIds:ids,
updatedAt:serverTimestamp()
},
{
merge:true
}
);


wishlist=ids;

}catch(error){

console.error(error);

alert("Wishlist update করা যায়নি।");

}

};
